app.innerHTML=`<header><a class="brand" href="." aria-label="Tabi, accueil"><span class="brand-mark">旅</span>tabi<span class="brand-dot">.</span></a><span class="brand-caption">LE JAPON À TRAVERS LE TEMPS</span><nav><button id="about">L’esprit du voyage <span>↗</span></button><button class="sound" id="sound" aria-pressed="false">♪ <span>Ambiance sonore</span></button></nav></header><main><section class="intro"><div><div class="eyebrow"><span></span> UN ARCHIPEL, MILLE HISTOIRES</div><h1>Le Japon se raconte.<br><em>À vous de l’explorer.</em></h1><p>Traversez les époques. Changez de regard.<br>Découvrez les histoires qui ont façonné le Japon.</p></div><div class="intro-aside"><span>日本</span><p>Un voyage dans le temps,<br>au fil des lieux.</p><div>EXPLORATION LIBRE <i>↙</i></div></div></section><section class="explorer" aria-label="Exploration historique"><aside class="lens-panel"><div class="eyebrow">CHOISIR UN REGARD</div><h2>Les lentilles</h2><p>Une époque, plusieurs histoires.</p><div class="lenses">${lenses.map(([id,n,icon])=>`<button data-lens="${id}" aria-pressed="${id==='all'}"><span>${icon}</span>${n}<i>↗</i></button>`).join('')}</div><div class="aside-note"><span>✧</span><p>Chaque lieu a quelque<br>chose à vous raconter.</p></div></aside><div class="map-panel"><div class="map-top"><span class="map-era"></span><span class="map-caption">L’ARCHIPEL À TRAVERS LE TEMPS</span></div><svg id="map" viewBox="0 0 700 560" aria-label="Carte interactive du Japon"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#becbc5" stroke-width=".45"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#526d51" flood-opacity=".12"/></filter></defs><rect width="700" height="560" fill="url(#grid)"/><g id="geography"></g><g id="markers"></g></svg><div class="sea sea-one">MER DU JAPON</div><div class="sea sea-two">OCÉAN PACIFIQUE</div><div class="compass">N<span>↑</span></div><div class="map-tools"><button id="zoom-in" aria-label="Agrandir la carte">+</button><button id="zoom-out" aria-label="Réduire la carte">−</button><button id="reset-map" aria-label="Recentrer la carte">⌖</button></div><div class="map-bottom"><span><i></i> <span id="count"></span> histoires à explorer</span><span>Carte indicative · frontières actuelles</span></div></div><aside class="story-panel" id="story"></aside></section><section class="timeline"><div class="timeline-head"><div><span class="eyebrow">VOYAGER DANS LE TEMPS</span><div class="date"><span id="year"></span><span id="era-name"></span></div></div><p>Faites glisser le temps.<br><strong>L’histoire se dévoile.</strong></p><button id="play" aria-label="Lancer le voyage temporel">▶</button></div><div class="range-wrap"><input type="range" id="time" min="710" max="2025" value="1831" aria-label="Année explorée"><div class="era-ticks">${eras.map(e=>`<button data-year="${e.start}" style="left:${(e.start-710)/1315*100}%">${e.start}<span>${e.name}</span></button>`).join('')}</div></div><div class="timeline-foot"><span>710 <span>LES PREMIÈRES CAPITALES</span></span><span>LE TEMPS PASSE, LES HISTOIRES RESTENT</span><span>AUJOURD’HUI <span>2025</span></span></div></section><section class="under"><span>✳</span><p>La grande histoire se découvre aussi dans les petits détails.</p><button id="random">Surprenez-moi <span>↗</span></button></section></main><footer><span>tabi. <span>Une invitation à regarder autrement.</span></span><button id="sources">À propos & sources ↗</button><span>CONÇU POUR LES ESPRITS CURIEUX</span></footer><dialog id="modal"><button class="close" aria-label="Fermer">×</button><div class="eyebrow">LE SENS DU VOYAGE</div><h2>L’histoire, de lieu en lieu.</h2><p>Tabi (旅, « voyage ») est un atlas de découverte de l’histoire du Japon. Explorez dix périodes et six lentilles, de Nara au Japon contemporain.</p><p>Les points présentent une sélection de récits : ils ne constituent pas une chronologie exhaustive. Chaque fiche propose une source pour approfondir. Les frontières sont actuelles ; la carte ne représente pas les territoires politiques anciens.</p><p>Les illustrations sont évocatrices. Fond cartographique : Natural Earth, via le jeu de données world.geo.json (domaine public). Ambiance : composition synthétique générée dans votre navigateur.</p><button class="modal-done">Reprendre le voyage →</button></dialog>`;
const project=(lon,lat)=>[85+(lon-128)*30,510-(lat-30)*31];
function path(coords){return coords.map(ring=>ring.map(([lon,lat],i)=>`${i?'L':'M'}${project(lon,lat).join(',')}`).join(' ')+'Z').join(' ')}
const polys=geo.geometry.type==='MultiPolygon'?geo.geometry.coordinates:[geo.geometry.coordinates];
document.querySelector('#geography').innerHTML=polys.map(p=>`<path d="${path(p)}" fill="#aebfa2" stroke="#f6f4e9" stroke-width="1.4" filter="url(#shadow)"/>`).join('')+`<text x="470" y="103" class="region">北海道</text><text x="367" y="315" class="region">本州</text><text x="175" y="461" class="region">九州</text><text x="258" y="451" class="region">四国</text>`;
function currentEra(){return eras.findIndex(e=>year>=e.start&&year<=e.end)}
function candidates(){return stories.filter(s=>s.era===currentEra()&&(lens==='all'||s.lens===lens))}
function render(){const ei=currentEra(),era=eras[ei],items=candidates();let s=items.find(s=>s.id===selected)||items[0];selected=s?.id??null;document.querySelector('#year').textContent=year;document.querySelector('#era-name').textContent=`Époque ${era.name}`;document.querySelector('.map-era').innerHTML=`<i></i> ${era.name.toUpperCase()} <span>${era.start} — ${era.end}</span>`;document.querySelector('#count').textContent=items.length;document.querySelectorAll('[data-lens]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lens===lens));document.querySelector('#time').value=year;
document.querySelector('#markers').innerHTML=items.map((p,i)=>{let [x,y]=project(p.lon,p.lat);if(p.city.includes('Tokyo')&&p.lens==='cuisine'){x+=27;y+=18}return `<g role="button" tabindex="0" aria-label="${p.title}" data-story="${p.id}" class="marker ${selected===p.id?'active':''}" transform="translate(${x},${y})"><circle class="halo" r="19"/><circle r="8"/><circle class="core" r="2.4"/><text x="15" y="-10">${p.city}</text></g>`}).join('');
const type=s?lenses.find(l=>l[0]===s.lens):null;
document.querySelector('#story').innerHTML=`<div class="story-art ${ei<4?'ancient':ei>6?'modern':''}"><span class="art-sun"></span><div class="mountain back"></div><div class="mountain front"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div><span class="art-kanji">${ei===5?'浮世':'日本'}</span><span class="art-caption">${ei===5?'ÉCHOS DU MONDE FLOTTANT':'PAYSAGES DU TEMPS'} · ILLUSTRATION</span><span class="art-number">${String(ei+1).padStart(2,'0')} / 10</span></div><div class="story-body"><div class="eyebrow"><span class="tiny-star">✳</span> ${s?'L’HISTOIRE À LA UNE':'UN AUTRE REGARD'}</div><div class="story-meta">${s?type[2]+' '+type[1]+' <span>•</span> '+s.year:era.start+' — '+era.end}</div><h2>${s?s.title:topics[lens][0]}</h2><div class="location">⌖ ${s?s.city:era.city} <span>JAPON</span></div><p>${s?s.text:'Aucun récit de cette sélection n’est encore disponible pour cette lentille à l’époque '+era.name+'. '+era.intro}</p>${s?`<a class="read-more" href="${s.source}" target="_blank" rel="noopener noreferrer">Approfondir cette histoire <span>↗</span></a>`:`<button class="read-more" id="show-all">Découvrir cette époque <span>→</span></button>`}<div class="story-pagination">${items.length?items.map(p=>`<button data-story="${p.id}" aria-label="Voir : ${p.title}" class="${p.id===selected?'chosen':''}"></button>`).join(''):'<span>La sélection s’enrichira au fil du voyage.</span>'}<span>${items.length?String(items.findIndex(p=>p.id===selected)+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0'):''}</span></div></div>`;
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-lens],[data-year],[data-story]');if(b?.dataset.lens){lens=b.dataset.lens;render()}if(b?.dataset.year){year=Number(b.dataset.year);render()}if(b?.dataset.story){selected=Number(b.dataset.story);render()}if(e.target.closest('#show-all')){lens='all';render()}});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-story]')){e.preventDefault();selected=Number(e.target.dataset.story);render()}});
document.querySelector('#time').addEventListener('input',e=>{year=Number(e.target.value);render()});
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Ⅱ':'▶';document.querySelector('#play').setAttribute('aria-label',playing?'Mettre en pause':'Lancer le voyage temporel');if(playing){if(year>=2025)year=710;timer=setInterval(()=>{year=Math.min(2025,year+5);render();if(year===2025)document.querySelector('#play').click()},180)}else clearInterval(timer)};
function setZoom(z){zoom=Math.max(1,Math.min(2.3,z));for(const id of ['geography','markers'])document.querySelector('#'+id).setAttribute('transform',`translate(${350*(1-zoom)},${290*(1-zoom)}) scale(${zoom})`)}
document.querySelector('#zoom-in').onclick=()=>setZoom(zoom+.25);document.querySelector('#zoom-out').onclick=()=>setZoom(zoom-.25);document.querySelector('#reset-map').onclick=()=>setZoom(1);
document.querySelector('#random').onclick=()=>{const s=stories.filter(s=>s.id!==selected)[Math.floor(Math.random()*(stories.length-1))];year=Math.max(eras[s.era].start,s.year);lens='all';selected=s.id;render();document.querySelector('.explorer').scrollIntoView({behavior:'smooth',block:'center'})};
const modal=document.querySelector('#modal');for(const id of ['about','sources'])document.querySelector('#'+id).onclick=()=>modal.showModal();document.querySelector('.close').onclick=()=>modal.close();document.querySelector('.modal-done').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});
document.querySelector('#sound').onclick=async()=>{if(!audio){const ctx=new AudioContext(),gain=ctx.createGain();gain.gain.value=.018;gain.connect(ctx.destination);[146.83,220,293.66,329.63].forEach((f,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;const g=ctx.createGain();g.gain.value=.3/(i+1);o.connect(g);g.connect(gain);o.start()});audio=ctx}sound=!sound;await audio[sound?'resume':'suspend']();document.querySelector('#sound').setAttribute('aria-pressed',sound);document.querySelector('#sound span').textContent=sound?'Couper l’ambiance':'Ambiance sonore'};
render();
</script></body></html>
